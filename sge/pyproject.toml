[project]
name = "sge-req"
version = "0.1.0"
description = "SGE requirements for reproducibility"
authors = [
    {name = "nunoloureco",email = "naml@dei.uc.pt"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "pyyaml",
    "tqdm",
    "matplotlib",
    "plotly"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]